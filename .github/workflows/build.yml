name: Extraer zip y compilar mod (.jar)

# Como usarlo:
#  1) Guarda este archivo en el repositorio como  .github/workflows/build.yml
#  2) Sube a la raiz del repositorio el .zip del mod (sin descomprimir)
#  3) GitHub extrae el zip, guarda el codigo en el repositorio y compila el .jar solo.
#     Si despues subes un zip nuevo (mismo nombre u otro), lo vuelve a extraer y compilar.
#     El .jar aparece en la pestana Actions > (ultima ejecucion) > Artifacts.

on:
  push:
  workflow_dispatch:
    inputs:
      reextraer:
        description: "Volver a extraer el zip (sobrescribe el codigo del repositorio)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Extraer el zip del mod
        id: extract
        env:
          REEXTRAER: ${{ inputs.reextraer }}
        run: |
          set -e
          FORCE="$REEXTRAER"
          # si este commit trae un .zip nuevo o cambiado, se vuelve a extraer solo
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -qi '\.zip$'; then
            FORCE=true
          fi
          if [ -f build.gradle ] && [ "$FORCE" != "true" ]; then
            echo "El codigo ya esta en el repositorio: se compila directamente."
            echo "extracted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ZIP=$(ls -1 ./*.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$ZIP" ]; then
            echo "::error::No hay ningun .zip en la raiz del repositorio (ni un build.gradle). Sube el zip del mod."
            exit 1
          fi
          echo "Extrayendo $ZIP"
          rm -rf /tmp/mod
          mkdir /tmp/mod
          unzip -q -o "$ZIP" -d /tmp/mod
          GRADLE_FILE=$(find /tmp/mod -name build.gradle | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "::error::El zip no contiene un proyecto del mod (falta build.gradle)."
            exit 1
          fi
          SRC=$(dirname "$GRADLE_FILE")
          rm -rf "$SRC/.github"
          cp -a "$SRC"/. .
          echo "extracted=true" >> "$GITHUB_OUTPUT"

      - name: Guardar el codigo extraido en el repositorio
        if: steps.extract.outputs.extracted == 'true'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar."
          else
            git commit -m "Codigo extraido automaticamente del zip"
            git push
          fi

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8

      - name: Compilar
        run: gradle build --no-daemon

      - name: Subir el .jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
